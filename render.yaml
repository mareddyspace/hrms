# Render Blueprint for the TimeZ HRMS API (FastAPI). Render: New -> Blueprint -> pick this repo. See DEPLOY.md.
# The portal (front end) stays on Vercel; files go to a Backblaze B2 bucket (S3-compatible); the database is Neon.
services:
  - type: web
    name: timez-hrms-api
    runtime: python
    plan: free
    # Same region as the Neon database (AWS us-east-2, Ohio): each request makes several database queries,
    # so the server must sit next to the database. Render can't move a service between regions.
    region: ohio
    rootDir: backend
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Python version for the build (all requirements have Linux wheels for 3.14). If a build ever says this
      # version is not available, change it to 3.13.
      - key: PYTHON_VERSION
        value: "3.14"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Render's proxy sets X-Forwarded-For; trust it so audit logs record the real client IP.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Apply database migrations once at start-up (advisory-locked). Seeding is manual (DEPLOY.md).
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: OTP_DEV_ECHO
        value: "false"
      - key: STORAGE_BACKEND
        value: s3

      # ---- secrets and per-deployment values: Render asks for these when you create the Blueprint ----
      - key: DATABASE_URL          # Neon -> Connect -> pooled connection string (postgresql://...)
        sync: false
      - key: JWT_SECRET            # random value generated by Render; don't change it after people sign in
        generateValue: true
      - key: CORS_ORIGINS          # https://<your-app>.vercel.app,http://localhost:5173
        sync: false
      - key: CORS_ORIGIN_REGEX     # optional, Vercel previews: ^https://<project>-[a-z0-9-]+\.vercel\.app$
        sync: false
      - key: DOCS_ENABLED          # optional: "true" = Swagger at /docs, asks for a portal sign-in (app/docs_auth.py); unset = off
        sync: false
      - key: OPENROUTER_API_KEY    # optional; empty = Copilot uses built-in answers
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MODEL_FALLBACKS
        sync: false
      - key: S3_ENDPOINT_URL       # Backblaze bucket "Endpoint", with https:// in front
        sync: false
      - key: S3_REGION             # the region part of the endpoint, e.g. us-east-005
        sync: false
      - key: S3_BUCKET             # the bucket name
        sync: false
      - key: S3_ACCESS_KEY_ID      # Backblaze application key: keyID
        sync: false
      - key: S3_SECRET_ACCESS_KEY  # Backblaze application key: applicationKey
        sync: false
